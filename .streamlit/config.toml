# Native theme adapted from Streamlit's minimal dashboard theme patterns.
[server]
headless = true
address = "127.0.0.1"
port = 8501

[browser]
gatherUsageStats = false

[theme]
base = "light"
primaryColor = "#2F6653"
backgroundColor = "#FCFBF8"
secondaryBackgroundColor = "#F0F0E9"
textColor = "#24372F"
borderColor = "#DCDFD5"
linkColor = "#2F6653"
font = "sans-serif"
headingFont = "serif"
baseFontSize = 15
headingFontSizes = ["42px", "29px", "22px", "19px", "16px", "14px"]
headingFontWeights = [600,600,500,500,500,500]
baseRadius = "10px"
buttonRadius = "8px"
showWidgetBorder = true
showSidebarBorder = true
dataframeHeaderBackgroundColor = "#EEF1EA"
greenColor = "#2F6653"
orangeColor = "#B76C3C"
redColor = "#B64E47"
chartCategoricalColors = ["#2F6653", "#B76C3C", "#8AA798", "#7C7896", "#BCA66B", "#538DA1"]

[theme.sidebar]
backgroundColor = "#EAF0E8"
secondaryBackgroundColor = "#F8FAF5"
textColor = "#24372F"
primaryColor = "#2F6653"
borderColor = "#D1DACE"
headingFont = "sans-serif"
